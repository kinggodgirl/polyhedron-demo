<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>다면체 수업 시연</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 교사가 PC·전자칠판에 띄워 시연하는 화면: 크게, 누르면 하나씩 드러나게 */
:root {
  color-scheme: light;
  --bg: #f3f6fb; --panel: #ffffff; --fg: #1c2733; --muted: #62707f; --line: #d5dde8;
  --face: #e8590c; --edge: #1c7ed6; --vertex: #7048e8; --ok: #2b8a3e; --ok-bg: #e6f4ea; --bad: #e03131; --btn-fg: #ffffff;
  --poly3d: 150,186,224; --poly3d-alt: 240,168,118;
  --display: "Jua", "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --body: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 18px; -webkit-user-select: none; user-select: none;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
button { font-family: var(--display); font-size: clamp(17px, 1.5vw, 22px); border-radius: 12px; cursor: pointer; border: 2px solid var(--line); background: var(--panel); color: var(--fg); padding: 8px 18px; min-height: 48px; }
button:focus-visible { outline: 3px solid var(--edge); outline-offset: 2px; }
button.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
button.sel, button.pick.sel { background: var(--edge); color: var(--btn-fg); border-color: var(--edge); }
button:disabled { opacity: .35; cursor: default; }
.c-face { color: var(--face); } .c-edge { color: var(--edge); } .c-vertex { color: var(--vertex); } .c-bad { color: var(--bad); }
#hd { display: flex; align-items: center; gap: 10px 18px; padding: 10px 20px 6px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-size: clamp(22px, 2vw, 30px); }
.brand small { font-family: var(--body); font-size: 14px; color: var(--muted); margin-left: 6px; }
#secs { display: flex; gap: 8px; flex-wrap: wrap; }
#secs button { border-radius: 999px; min-height: 42px; padding: 4px 18px; }
#secs button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
#dots { display: flex; gap: 6px; margin-left: auto; }
#dots button { min-height: 36px; min-width: 36px; padding: 2px 8px; font-size: 16px; border-radius: 999px; }
#dots button.on { background: var(--edge); color: var(--btn-fg); border-color: var(--edge); }
#scene { flex: 1; min-height: 0; padding: 4px 20px; display: flex; flex-direction: column; gap: 12px; }
#ft { display: flex; align-items: center; gap: 12px; padding: 8px 20px 12px; }
#stitle { flex: 1; text-align: center; font-family: var(--display); font-size: clamp(16px, 1.6vw, 22px); color: var(--muted); }
#ft button { min-width: 140px; }
.scene-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.scene-head h2 { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 3vw, 44px); margin: 0; flex: 1 1 auto; }
.tools, .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.lab { font-size: 16px; color: var(--muted); min-width: 4.5em; }
.two { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px 20px; overflow: auto; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.lead { margin: 0; font-size: clamp(16px, 1.4vw, 20px); color: var(--muted); }
.note { margin: 0; font-size: 15px; color: var(--muted); }
.stage { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; touch-action: none; min-height: 300px; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage .hint { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-size: 14px; color: var(--muted); pointer-events: none; }
.stage .tag { position: absolute; right: 18px; top: 14px; font-family: var(--display); font-size: clamp(24px, 2.6vw, 40px); pointer-events: none; }
.stage .big { position: absolute; left: 18px; top: 14px; font-family: var(--display); font-size: clamp(28px, 3.6vw, 56px); pointer-events: none; }
.stage .big b { font-weight: 400; }
.stage .stamp { position: absolute; left: 18px; bottom: 30px; font-family: var(--display); font-size: clamp(22px, 2.6vw, 38px); padding: 2px 16px; border-radius: 12px; border: 4px solid transparent; transform: rotate(-4deg); transform-origin: left bottom; pointer-events: none; }
.stage .stamp.yes { color: var(--ok); border-color: var(--ok); background: var(--ok-bg); }
.stage .stamp.no { color: var(--bad); border-color: var(--bad); background: var(--panel); }
.stage .corner { position: absolute; left: 18px; top: 14px; z-index: 2; }
@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 60% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); } }
@keyframes stampIn { 0% { transform: scale(1.8) rotate(-12deg); opacity: 0; } 60% { transform: scale(.92) rotate(-4deg); opacity: 1; } 100% { transform: scale(1) rotate(-4deg); } }
.pop { animation: pop .4s ease-out both; }
.stage .stamp.pop { animation: stampIn .35s ease-out both; }
@media (prefers-reduced-motion: reduce) { .pop, .stage .stamp.pop { animation: none !important; } }
/* 장면 1 */
.grid12 { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(2, 1fr); gap: 12px; }
.gtile { position: relative; background: var(--panel); border: 3px solid var(--line); border-radius: 16px; overflow: hidden; cursor: pointer; touch-action: none; }
.gtile canvas { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - 36px); }
.gtile .num { position: absolute; left: 12px; top: 6px; font-family: var(--display); font-size: clamp(22px, 2vw, 32px); color: var(--muted); }
.gtile .st { position: absolute; right: 12px; top: 0; font-family: var(--display); font-size: clamp(32px, 3vw, 48px); }
.gtile .nm { position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; font-size: clamp(16px, 1.4vw, 20px); font-weight: 700; }
.gtile.yes { border-color: var(--ok); } .gtile.yes .st { color: var(--ok); }
.gtile.no { border-color: var(--bad); } .gtile.no .st { color: var(--bad); }
/* 장면 1: 분류 상자 */
.sortwrap { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
.bin { background: var(--panel); border: 3px dashed var(--line); border-radius: 18px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; min-height: 0; transition: background .15s, border-color .15s; }
.bin h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(22px, 2.2vw, 32px); text-align: center; }
.bin .cnt { color: var(--muted); font-size: .8em; }
.bin.yes { border-style: solid; border-color: var(--ok); } .bin.yes h3 { color: var(--ok); }
.bin.no { border-style: solid; border-color: var(--bad); } .bin.no h3 { color: var(--bad); }
.bin.over { background: #e7f1fd; border-color: var(--edge); }
.bin .cards { flex: 1; min-height: 0; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); grid-auto-rows: 132px; gap: 8px; align-content: start; }
.card { position: relative; background: var(--bg); border: 3px solid var(--line); border-radius: 14px; cursor: grab; touch-action: none; }
.card canvas { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - 22px); pointer-events: none; }
.card .num { position: absolute; left: 8px; top: 2px; font-family: var(--display); font-size: 22px; color: var(--muted); }
.card .mark { position: absolute; right: 8px; top: -2px; font-family: var(--display); font-size: 30px; }
.card .nm { position: absolute; left: 0; right: 0; bottom: 3px; text-align: center; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card.right { border-color: var(--ok); } .card.right .mark { color: var(--ok); }
.card.wrong { border-color: var(--bad); background: #fff0f0; } .card.wrong .mark { color: var(--bad); }
.card.dragging { position: fixed; z-index: 50; cursor: grabbing; pointer-events: none; box-shadow: 0 12px 30px rgba(0,0,0,.25); }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
.shake { animation: shake .4s ease; }
.modal { position: fixed; inset: 0; z-index: 40; background: rgba(20, 28, 38, .55); display: flex; align-items: center; justify-content: center; padding: 24px; }
.mbox { background: var(--panel); border-radius: 20px; width: min(980px, 100%); height: min(760px, 100%); display: flex; flex-direction: column; gap: 12px; padding: 16px 20px; }
.mhead { display: flex; align-items: center; gap: 12px; }
.mhead h3 { flex: 1; margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(26px, 2.6vw, 40px); }
.mstage { flex: 1; min-height: 0; display: flex; } .mstage .stage { flex: 1; }
.mbtns { display: flex; gap: 12px; }
.mbtns .choose { flex: 1; min-height: 72px; font-size: clamp(24px, 2.4vw, 34px); border-width: 3px; }
.choose.yes { color: var(--ok); border-color: var(--ok); } .choose.no { color: var(--bad); border-color: var(--bad); }
.choose.yes.sel { background: var(--ok); color: #fff; } .choose.no.sel { background: var(--bad); color: #fff; }
@media (max-width: 1000px), (max-height: 560px) { .sortwrap { grid-template-columns: 1fr; } .bin .cards { grid-auto-rows: 120px; } .bin { min-height: 200px; } }
.modal { opacity: 0; transition: opacity .2s ease; }
.modal.show { opacity: 1; }
.modal .mbox { transform: scale(.94) translateY(12px); transition: transform .22s cubic-bezier(.2,.8,.3,1); position: relative; }
.modal.show .mbox { transform: none; }
.mhead small { font-family: var(--body); font-size: 16px; color: var(--muted); margin-left: 8px; }
.mhead .mprev, .mhead .mnext { min-width: 52px; padding: 4px 10px; }
.mstage { transition: none; }
@keyframes outL { to { transform: translateX(-60px); opacity: 0; } }
@keyframes outR { to { transform: translateX(60px); opacity: 0; } }
@keyframes inR { from { transform: translateX(60px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes inL { from { transform: translateX(-60px); opacity: 0; } to { transform: none; opacity: 1; } }
.mstage.out-l { animation: outL .17s ease-in forwards; } .mstage.out-r { animation: outR .17s ease-in forwards; }
.mstage.in-r { animation: inR .26s ease-out; } .mstage.in-l { animation: inL .26s ease-out; }
.choose kbd { font-family: var(--body); font-size: .5em; border: 1.5px solid currentColor; border-radius: 6px; padding: 0 6px; margin-left: 8px; vertical-align: middle; opacity: .7; }
.choose.flash { transform: scale(.96); filter: brightness(1.1); }
.choose.yes.flash { background: var(--ok); color: #fff; } .choose.no.flash { background: var(--bad); color: #fff; }
.choose { transition: transform .12s, background .12s, color .12s; }
.mtoast { position: absolute; left: 50%; bottom: 104px; transform: translateX(-50%); font-family: var(--display); font-size: clamp(18px, 1.8vw, 26px); padding: 6px 18px; border-radius: 999px; color: #fff; opacity: 0; pointer-events: none; white-space: nowrap; }
.mtoast.yes { background: var(--ok); } .mtoast.no { background: var(--bad); }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 10px); } 15% { opacity: 1; transform: translate(-50%, 0); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -8px); } }
.mtoast.toast { animation: toast 1.1s ease forwards; }
.card { transition: border-color .2s, background .2s; }
@media (prefers-reduced-motion: reduce) { .modal, .modal .mbox, .choose { transition: none; } .mstage.out-l, .mstage.out-r, .mstage.in-l, .mstage.in-r { animation: none; } }
.sortwrap.c4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
.bin.b0 { border-style: solid; border-color: var(--vertex); } .bin.b0 h3 { color: var(--vertex); }
.bin.b1 { border-style: solid; border-color: var(--face); } .bin.b1 h3 { color: var(--face); }
.bin.b2 { border-style: solid; border-color: var(--muted); } .bin.b2 h3 { color: var(--muted); }
.choose.b0 { color: var(--vertex); border-color: var(--vertex); } .choose.b1 { color: var(--face); border-color: var(--face); } .choose.b2 { color: var(--muted); border-color: var(--muted); }
.choose.b0.sel, .choose.b0.flash { background: var(--vertex); color: #fff; } .choose.b1.sel, .choose.b1.flash { background: var(--face); color: #fff; } .choose.b2.sel, .choose.b2.flash { background: var(--muted); color: #fff; }
.mtoast.b0 { background: var(--vertex); } .mtoast.b1 { background: var(--face); } .mtoast.b2 { background: var(--muted); }
.sortnote { background: #eef6ff; border: 2px solid var(--edge); border-radius: 14px; padding: 10px 16px; font-size: clamp(17px, 1.6vw, 24px); }
.sortnote b { font-weight: 700; }
.term.on.face { border-color: var(--face); background: #fff3ea; } .term.on.edge { border-color: var(--edge); background: #eaf3fd; } .term.on.vertex { border-color: var(--vertex); background: #f1edfd; }
button.cnt.on.vertex { background: var(--vertex); color: #fff; } button.cnt.on.edge { background: var(--edge); color: #fff; } button.cnt.on.face { background: var(--face); color: #fff; }
@media (max-width: 1000px), (max-height: 560px) { .sortwrap.c4 { grid-template-columns: 1fr; } }
/* 장면 2 */
.sent { font-family: var(--display); font-size: clamp(26px, 2.8vw, 44px); line-height: 1.7; }
.sent b { font-weight: 400; color: var(--edge); }
.chipw { display: inline-flex; flex-direction: column; align-items: center; vertical-align: top; margin: 0 2px 8px; }
.chip { font-size: 1em; min-height: 0; padding: 0 .4em; border: 3px dashed var(--line); color: var(--muted); border-radius: 12px; background: var(--bg); }
.chip.on { border-style: solid; color: var(--btn-fg); }
.chip.on.poly { background: var(--face); border-color: var(--face); }
.chip.on.closed { background: var(--edge); border-color: var(--edge); }
.chip.on.solid { background: var(--vertex); border-color: var(--vertex); }
.chipw small { font-family: var(--body); font-size: .4em; color: var(--muted); line-height: 1.5; max-width: 12em; text-align: center; }
/* 장면 3 */
.picks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
button.wide { width: 100%; min-height: 60px; font-size: clamp(20px, 2vw, 28px); }
.qcard { background: var(--bg); border-radius: 12px; padding: 10px 14px; font-size: clamp(16px, 1.4vw, 20px); }
.qcard summary { cursor: pointer; font-family: var(--display); }
.qcard p { margin: 8px 0 0; }
/* 표 */
.ctab { border-collapse: collapse; width: 100%; font-size: clamp(16px, 1.5vw, 22px); }
.ctab th, .ctab td { border: 1px solid var(--line); padding: 8px 10px; text-align: center; }
.ctab th { font-weight: 500; color: var(--muted); background: var(--bg); }
.ctab.big { font-size: clamp(20px, 2vw, 30px); table-layout: fixed; }
.ctab.big th:first-child { width: 34%; }
.sent .tail { white-space: nowrap; }
.ctab.big td, .ctab.big th { padding: 10px 8px; }
.ctab td.q { color: var(--muted); cursor: pointer; background: repeating-linear-gradient(45deg, var(--bg), var(--bg) 8px, var(--panel) 8px, var(--panel) 16px); }
.ctab td.rev { font-family: var(--display); cursor: pointer; }
.ctab td.formula.rev { color: var(--edge); }
.ctab tr.cur th { color: var(--fg); background: #e7f1fd; }
.ctab tr.frow th, .ctab tr.frow td { border-top: 3px solid var(--fg); }
.ctab.feat th { width: 30%; text-align: left; }
.ctab.feat td { text-align: left; }
.sw { display: inline-block; width: 16px; height: 16px; border-radius: 4px; vertical-align: -2px; margin-left: 4px; }
.sw.blue { background: rgb(150,186,224); } .sw.orange { background: rgb(240,168,118); }
.bigname { font-family: var(--display); font-size: clamp(26px, 2.8vw, 42px); }
.bigname b { font-weight: 400; }
.defbox p { margin: 0 0 8px; font-size: clamp(17px, 1.5vw, 22px); }
.defbox .def { font-family: var(--display); font-size: clamp(22px, 2.2vw, 32px); line-height: 1.5; }
input[type=range] { flex: 1 1 200px; height: 40px; accent-color: var(--edge); }
button.pick.mini { min-height: 44px; padding: 4px 14px; }
/* 장면 6 */
.terms { display: flex; flex-direction: column; gap: 10px; }
.term { display: flex; align-items: center; gap: 16px; text-align: left; padding: 12px 18px; min-height: 72px; border-width: 3px; }
.term .tw { font-size: clamp(26px, 2.6vw, 40px); min-width: 3.2em; }
.term .td { font-family: var(--body); font-size: clamp(16px, 1.5vw, 22px); }
.term.face:hover { border-color: var(--face); } .term.edge:hover { border-color: var(--edge); } .term.vertex:hover { border-color: var(--vertex); }
button.cnt.vertex { border-color: var(--vertex); color: var(--vertex); } button.cnt.edge { border-color: var(--edge); color: var(--edge); } button.cnt.face { border-color: var(--face); color: var(--face); }
@media (max-width: 1000px), (max-height: 560px) {
  body { height: auto; min-height: 100dvh; overflow: auto; }
  .two { grid-template-columns: 1fr; }
  .two .stage { height: 52vh; }
  .grid12 { grid-template-columns: repeat(3, 1fr); grid-template-rows: none; grid-auto-rows: 180px; }
  #dots { margin-left: 0; }
  #ft button { min-width: 0; }
}
.stage-ctrls { position: absolute; right: 12px; bottom: 10px; z-index: 2; display: flex; align-items: center; gap: 6px; }
.stage-ctrls button { min-height: 34px; padding: 2px 10px; font-size: 14px; border-radius: 999px; opacity: .85; }
.stage-ctrls button:hover { opacity: 1; }
.stage-lock { display: inline-flex; align-items: center; gap: 5px; background: var(--panel); border: 2px solid var(--line); border-radius: 999px; padding: 4px 10px; font-family: var(--display); font-size: 14px; color: var(--fg); cursor: pointer; opacity: .88; min-height: 34px; }
.stage-lock:hover { opacity: 1; }
.stage-lock input { accent-color: var(--edge); width: 16px; height: 16px; margin: 0; cursor: pointer; }
.corner-row { position: absolute; left: 18px; top: 14px; z-index: 2; display: flex; gap: 8px; }
.corner-row .corner { position: static; }
.choose.hold { color: var(--muted); border-color: var(--line); flex: 0.65; }
.choose.hold.flash { background: var(--muted); color: #fff; }
.mtoast.hold { background: var(--muted); }
.mwhy { background: #eef6ff; border: 2px solid var(--edge); border-radius: 12px; padding: 8px 14px; font-size: clamp(16px, 1.4vw, 20px); text-align: center; }
.picks .shape-pick { height: 78px; min-height: 78px; padding: 4px; display: flex; align-items: center; justify-content: center; }
.picks .shape-pick canvas { width: 100%; height: 100%; display: block; pointer-events: none; }
.ctab.layers th, .ctab.layers td { padding: 8px 6px; font-size: clamp(16px, 1.5vw, 22px); }
.ctab.layers tr.sumrow th, .ctab.layers tr.sumrow td { border-top: 3px solid var(--fg); font-family: var(--display); background: #f8fafd; }
.layer-badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-family: var(--display); font-size: .85em; }
.layer-badge.l1 { background: #e7f1fd; color: var(--edge); }
.layer-badge.l2 { background: #fff3ea; color: var(--face); }
.layer-badge.l3 { background: #f1edfd; color: var(--vertex); }
.ctab td.nb { color: var(--line); }
.ctab td.sumc { font-size: .9em; }

/* 도입 · 학습지 동기화 */
.wschip { font-family: var(--display); font-size: clamp(14px, 1.2vw, 18px); color: #7a5b00; background: #fff4cc; border: 2px solid #f2d36b; border-radius: 999px; padding: 2px 14px; white-space: nowrap; }
.wsfoot { font-size: .8em; color: #7a5b00; background: #fff4cc; border-radius: 999px; padding: 1px 10px; margin-left: 6px; }
.scene-head h2 .sub { font-size: .45em; color: var(--muted); margin-left: 10px; }
.cover { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.2fr 1fr; gap: 24px; align-items: center; }
.cover img { max-height: 100%; max-width: 100%; justify-self: center; border-radius: 18px; object-fit: contain; min-height: 0; height: 100%; }
.cover-txt { padding-left: 4vw; }
.cover .unit { font-family: var(--display); font-size: clamp(22px, 2.4vw, 36px); color: var(--muted); }
.cover h1 { font-family: var(--display); font-weight: 400; font-size: clamp(48px, 6vw, 96px); margin: 10px 0; }
.cover h1 span { font-size: .55em; color: var(--edge); }
.cover .page { font-family: var(--display); font-size: clamp(22px, 2.2vw, 34px); }
.cover-hint { margin-top: 30px; color: var(--muted); }
.quiz { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.4fr); gap: 28px; align-items: center; }
.quiz img { height: 100%; max-height: 100%; max-width: 100%; justify-self: center; object-fit: contain; border-radius: 16px; min-height: 0; }
.quiz-q { font-family: var(--display); font-size: clamp(24px, 2.6vw, 40px); margin: 0 0 18px; }
.quiz-q b { color: var(--edge); font-weight: 400; }

button.qopt { font-size: clamp(22px, 2.3vw, 34px); min-height: 70px; }
button.qopt.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
button.qopt.no { background: #fde8e8; border-color: var(--bad); color: var(--bad); text-decoration: line-through; }

.quiz-a b { color: var(--ok); font-weight: 400; }
.quiz-end { grid-column: 1 / -1; text-align: center; font-family: var(--display); }
.quiz-end p { font-size: clamp(22px, 2.4vw, 36px); color: var(--muted); }
.quiz-end .punch { font-size: clamp(34px, 4.4vw, 68px); color: var(--fg); }
.quiz-end .punch b { color: var(--face); font-weight: 400; }
.goal { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 18px; font-family: var(--display); }
.goal-lab { font-size: clamp(22px, 2vw, 30px); background: var(--fg); color: var(--bg); border-radius: 999px; padding: 4px 26px; }
.goal-txt { font-size: clamp(34px, 4vw, 62px); text-align: center; margin: 0; line-height: 1.35; }
.goal-txt b { color: var(--edge); font-weight: 400; }

.goal-map small { font-family: var(--body); font-size: .7em; color: #7a5b00; margin-left: 8px; }
.callout { margin: 0; background: #fff4cc; border: 2px solid #f2d36b; border-radius: 12px; padding: 10px 14px; font-size: clamp(16px, 1.4vw, 20px); }
.ctab th.rowpick, .ctab th.colpick { cursor: pointer; }
.ctab th.colpick.on { background: #e7f1fd; color: var(--fg); }
.ctab td.given { color: var(--muted); font-family: var(--display); }
.ctab .brk { display: block; font-size: .55em; color: var(--muted); font-family: var(--body); }
.ctab td.hl { background: #fff4cc; font-family: var(--display); }
.ctab.analyze td, .ctab.analyze th { font-size: clamp(17px, 1.6vw, 24px); }
.qbox { margin: 0; font-size: clamp(18px, 1.6vw, 24px); background: var(--bg); border-radius: 12px; padding: 12px 14px; }
.hint1 { margin: 0 0 8px; font-size: clamp(17px, 1.5vw, 22px); }
.answer { margin: 0 0 8px; font-family: var(--display); font-size: clamp(26px, 2.6vw, 40px); }

button.cand { display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 76px; }
button.cand small { font-family: var(--body); font-size: 15px; color: var(--muted); }
button.cand.ok { border-color: var(--ok); background: var(--ok-bg); }
button.cand.no { opacity: .55; }
.drawtips p { margin: 0 0 8px; font-size: clamp(17px, 1.5vw, 22px); color: var(--muted); padding: 6px 10px; border-radius: 10px; }
.drawtips p.on { color: var(--fg); background: #e7f1fd; }
.drawtips p.done { color: var(--fg); }
.why4 p { margin: 0 0 6px; font-size: clamp(17px, 1.5vw, 22px); }

    if (e.target.closest && e.target.closest('input, textarea')) return;
    if (document.querySelector('.modal:not([hidden])')) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); go(cur + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(cur - 1); }
    else if (e.key === ' ' && !(e.target.closest && e.target.closest('button'))) { e.preventDefault(); if (active.primary) active.primary(); }
    else if (e.key >= '1' && e.key <= '5') { var s = Number(e.key) - 1; for (var i = 0; i < SCENES.length; i++) if (SCENES[i].sec === s) { go(i); break; } }
  });
  var last = 0;
  function loop(t) {
    var dt = Math.min(50, t - (last || t)); last = t;
    if (active && active.frame) active.frame(dt, cols());
    requestAnimationFrame(loop);
  }
  var start = /^#s(\d+)$/.exec(location.hash);
  go(start ? Math.min(SCENES.length, Math.max(1, Number(start[1]))) - 1 : 0);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
